name: "Credly Badge README Updater"
description: "Auto-sync your Credly certifications and badges to your GitHub profile README"
author: "Sagargupta16"

branding:
  icon: "award"
  color: "orange"

inputs:
  credly-username:
    description: "Your Credly username (from your Credly profile URL)"
    required: true
  readme-path:
    description: "Path to your README file"
    required: false
    default: "README.md"
  badge-size:
    description: "Badge image size in pixels"
    required: false
    default: "100"
  max-retries:
    description: "Max retry attempts for Credly API calls"
    required: false
    default: "3"
  cert-keywords:
    description: "Comma-separated keywords to identify industry certifications (matched against badge name)"
    required: false
    default: "Certified"
  professional-keywords:
    description: "Comma-separated keywords to identify professional/partner badges"
    required: false
    default: "Partner: Technical,Generative AI Technical Intermediate,AI Foundational,Well-Architected Proficient"
  output:
    description: "What to write: readme (the section between the markers), svg (one self-contained animated SVG card of every badge), or both"
    required: false
    default: "readme"
  svg-path:
    description: "Where to write the SVG card when output is svg or both; missing folders are created"
    required: false
    default: "assets/credly-badges.svg"
  svg-groups:
    description: "SVG card grouping: two (industry certifications, then every other badge as learning and partner badges) or three (the README's three categories)"
    required: false
    default: "two"
  svg-per-row:
    description: "Comma-separated badges per row for each SVG group, 1 to 12; the last value repeats for later groups"
    required: false
    default: "6,8"
  svg-mobile-path:
    description: "Also write a 400px-wide phone card here when output is svg or both, for a <picture> source; empty draws none"
    required: false
    default: ""
  accent:
    description: "Hex color of the SVG card's group labels"
    required: false
    default: "#60a5fa"
  hide-expired:
    description: "Leave out badges whose expires_at_date has passed (true/false)"
    required: false
    default: "false"
  sort:
    description: "Badge order: credly (your profile order), newest or oldest (by issue date)"
    required: false
    default: "credly"
  max-badges:
    description: "Show at most this many badges, after hide-expired and sort; 0 shows every badge"
    required: false
    default: "0"
  commit:
    description: "Commit and push the written files when they changed, as github-actions[bot] (true/false); needs permissions: contents: write"
    required: false
    default: "false"
  commit-message:
    description: "Commit message used when commit is true"
    required: false
    default: "chore: update Credly badges"

outputs:
  total-badges:
    description: "Number of badges written, after hide-expired and max-badges"
    value: ${{ steps.run-updater.outputs.total-badges }}
  certifications-count:
    description: "Number of industry certifications"
    value: ${{ steps.run-updater.outputs.certifications-count }}
  professional-count:
    description: "Number of professional/partner badges"
    value: ${{ steps.run-updater.outputs.professional-count }}
  knowledge-count:
    description: "Number of knowledge/learning badges"
    value: ${{ steps.run-updater.outputs.knowledge-count }}
  changed:
    description: "Whether the README or an SVG card was updated (true/false)"
    value: ${{ steps.run-updater.outputs.changed }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    # Pillow only shrinks the badge images inlined into the SVG card, so README
    # mode skips it. Pinned by hand: Renovate does not read versions in a run: block.
    - name: Install Pillow for the SVG card
      if: inputs.output != 'readme'
      shell: bash
      # block scalar: a bare ':all:' value would parse as a YAML mapping
      run: |
        python -m pip install --quiet --only-binary :all: pillow==13.0.0

    - name: Run Credly badge updater
      id: run-updater
      shell: bash
      env:
        CREDLY_USERNAME: ${{ inputs.credly-username }}
        README_PATH: ${{ inputs.readme-path }}
        BADGE_SIZE: ${{ inputs.badge-size }}
        MAX_RETRIES: ${{ inputs.max-retries }}
        CERT_KEYWORDS: ${{ inputs.cert-keywords }}
        PROFESSIONAL_KEYWORDS: ${{ inputs.professional-keywords }}
        OUTPUT: ${{ inputs.output }}
        SVG_PATH: ${{ inputs.svg-path }}
        SVG_GROUPS: ${{ inputs.svg-groups }}
        SVG_PER_ROW: ${{ inputs.svg-per-row }}
        SVG_MOBILE_PATH: ${{ inputs.svg-mobile-path }}
        ACCENT: ${{ inputs.accent }}
        HIDE_EXPIRED: ${{ inputs.hide-expired }}
        SORT: ${{ inputs.sort }}
        MAX_BADGES: ${{ inputs.max-badges }}
        COMMIT: ${{ inputs.commit }}
        COMMIT_MESSAGE: ${{ inputs.commit-message }}
      run: python "${{ github.action_path }}/update-credly-badges.py"
